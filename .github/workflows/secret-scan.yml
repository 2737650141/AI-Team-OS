# SEC-01 防复发（008 2.7-4）：CI 秘密扫描。
# 本仓库当前为本地单仓库（无 remote，未配置 CI）；该 workflow 供未来配置 CI 时启用，
# 与本地 pre-commit / 打包扫描共用 app.core.secrets.SECRET_PATTERNS。
name: secret-scan

on:
  push:
  pull_request:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Scan staged-equivalent tree
        run: |
          pip install .
          python - <<'EOF'
          import sys
          from pathlib import Path
          from app.core.secrets import SECRET_PATTERNS
          from app.scripts.scan_staged_secrets import EXEMPT_PREFIXES

          bad = []
          for p in Path(".").rglob("*"):
              if p.is_file() and not any(part in {".git", ".venv", "node_modules", "__pycache__", "runtime", "artifacts"} for part in p.parts):
                  for line in p.read_text(encoding="utf-8", errors="ignore").splitlines():
                      if any(e.search(line) for e in EXEMPT_PREFIXES):
                          continue
                      for pat in SECRET_PATTERNS:
                          if pat.search(line):
                              bad.append(f"{p}: {pat.pattern[:50]}")
                              break
          if bad:
              print("SECRET SCAN FAILED:")
              for b in bad[:20]:
                  print("  " + b)
              sys.exit(1)
          print("secret scan: clean")
          EOF
