# SEC-01 防复发（008 2.7-4）：CI 秘密扫描。
# 本仓库当前为本地单仓库（无 remote，未配置 CI）；该 workflow 供未来配置 CI 时启用，
# 与本地 pre-commit / 打包扫描共用 app.core.secrets.SECRET_PATTERNS。
name: secret-scan

on:
  push:
  pull_request:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Scan staged-equivalent tree
        run: |
          pip install .
          python - <<'EOF'
          import importlib.util
          import sys
          from pathlib import Path

          from app.core.secrets import SECRET_PATTERNS

          spec = importlib.util.spec_from_file_location(
              "scan_staged_secrets", "scripts/scan_staged_secrets.py"
          )
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)

          spec2 = importlib.util.spec_from_file_location(
              "make_m3c_zip", "scripts/make_m3c_zip.py"
          )
          mod2 = importlib.util.module_from_spec(spec2)
          spec2.loader.exec_module(mod2)
          EXEMPT = mod2.SENSITIVE_EXEMPT  # 与打包脚本同一豁免白名单（sa_20260808_103016）

          bad = []
          for p in Path(".").rglob("*"):
              if p.is_file() and not any(part in {".git", ".venv", "node_modules", "__pycache__", "runtime", "artifacts"} for part in p.parts):
                  rel = p.as_posix()
                  if rel in EXEMPT:
                      continue
                  # 整个文件文本一次扫描（DOTALL 多行 PEM 才能命中）
                  hits = mod.scan_text(p.read_text(encoding="utf-8", errors="ignore"))
                  if hits:
                      bad.append(f"{p}: {hits[0]}")
          if bad:
              print("SECRET SCAN FAILED:")
              for b in bad[:20]:
                  print("  " + b)
              sys.exit(1)
          print("secret scan: clean")
          EOF
