[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-team-os"
version = "0.1.0"
description = "AI Team OS — 多智能体协作团队平台（M0-M1 最小执行内核）"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.2,<2.0",
    "langgraph-checkpoint-sqlite>=1.0",
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.30,<1.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "pywinauto==0.6.9; sys_platform == 'win32'",
    "Pillow>=11.0,<13.0",
    "mss>=10.0,<11.0; sys_platform == 'win32'",
    "opencv-python-headless>=4.10,<5.0",
    "sounddevice>=0.5.5,<0.6; sys_platform == 'win32'",
    "tiktoken>=0.11,<1.0",
    "pywin32>=310; sys_platform == 'win32'",
    "pypdf>=4.0,<6.0",  # PDF 只读文本提取（007 3.1：许可证 BSD-3-Clause，纯 Python，不执行 PDF 脚本）
    "pywinauto==0.6.9; sys_platform == 'win32'",  # M5-A：Windows UI Automation / Accessibility
    "Pillow>=11.0,<13.0",  # M5-B：显式图像处理依赖（HPND/Pillow）
    "mss>=10.0,<11.0; sys_platform == 'win32'",  # M5-B：Windows 多显示器截图（MIT）
    "opencv-python-headless>=4.10,<5.0",  # M5-B：本地确定性 CV（Apache-2.0 / wheel MIT）
    "sounddevice>=0.5.5,<0.6; sys_platform == 'win32'",  # M6-A: audio capture (MIT)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<6.0",
    "ruff>=0.5,<1.0",
    "mypy>=1.10,<2.0",
    "httpx>=0.27,<1.0",
    "reportlab>=4.0,<5.0",  # 测试专用：合成 PDF 生成（007 3.1 测试）
]
voice-local = [
    "onnxruntime>=1.22,<2.0; sys_platform == 'win32'",
    "openwakeword==0.6.0; sys_platform == 'win32'",
]
desktop-build = [
    "pyinstaller>=6.15,<7.0",
]

[project.scripts]
ai-team-os = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

# importorskip 必须出现在 app 导入之前（收集期提前跳过 win32 缺失模块）
[tool.ruff.lint.per-file-ignores]
"tests/test_visual_desktop_intelligence.py" = ["E402"]
"tests/test_windows_action_layer.py" = ["E402"]

[tool.mypy]
python_version = "3.12"
platform = "win32"  # 产品为 Windows-only：按 win32 平台解析 typeshed（ctypes.windll 等）
strict = false

# 以下为 win32-only 第三方模块：无类型存根且 CI(Linux) 上未安装
[[tool.mypy.overrides]]
module = "mss,pywinauto"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# 裸 `pytest`（如 CI）不把 CWD 加入 sys.path；tests 包内的跨文件导入需要仓库根
pythonpath = ["."]
