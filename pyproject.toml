[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-team-os"
version = "0.1.0"
description = "AI Team OS — 多智能体协作团队平台（M0-M1 最小执行内核）"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.2,<2.0",
    "langgraph-checkpoint-sqlite>=1.0",
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.30,<1.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "pypdf>=4.0,<6.0",  # PDF 只读文本提取（007 3.1：许可证 BSD-3-Clause，纯 Python，不执行 PDF 脚本）
    "pywinauto==0.6.9; sys_platform == 'win32'",  # M5-A：Windows UI Automation / Accessibility
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<6.0",
    "ruff>=0.5,<1.0",
    "mypy>=1.10,<2.0",
    "httpx>=0.27,<1.0",
    "reportlab>=4.0,<5.0",  # 测试专用：合成 PDF 生成（007 3.1 测试）
]

[project.scripts]
ai-team-os = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.11"
strict = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
