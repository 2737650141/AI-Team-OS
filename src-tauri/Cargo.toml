[package]
name = "ai-team-os-desktop"
version = "0.1.0"
description = "AI Team OS desktop shell"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
strip = true
